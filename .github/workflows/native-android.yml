name: Native Android CI
on:
  push:
    branches: [ "native/android" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download offline pose model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task" -o app/src/main/assets/pose_landmarker_full.task
      - run: gradle --no-daemon :app:assembleDebug
