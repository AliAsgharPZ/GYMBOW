name: Release

on:
  push:
    branches:
      - release/v0.1
    tags:
      - "v0.1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check and production build
        run: npm run build
      - name: Package web build
        run: |
          cd dist
          zip -r ../GYMBOW-web-v0.1.zip .
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1
          target_commitish: ${{ github.sha }}
          name: GYMBOW v0.1
          generate_release_notes: true
          make_latest: true
          files: GYMBOW-web-v0.1.zip
